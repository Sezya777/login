<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Олимпиада</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="container">
    <div class="box">

      <div class="image-side">
        <img src="cryptoimg.jpg" alt="crypto">
      </div>


      <div class="form-side">
        <h2>Sign In</h2>

        <form>
          <input type="email" placeholder="example@gmail.com" required>
          <input type="password" placeholder="Qwerty123" required>
          <button type="submit">Login</button>
        </form>

        <p><strong>Don't have an account?</strong> <a href="signup.html">Sign up here</a></p>
      </div>

    </div>
  </div>

  <script src="auth.js"></script>

</body>
</html>
